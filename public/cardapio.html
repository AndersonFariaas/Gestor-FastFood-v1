<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete • Cardápio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-800" data-page="cardapio">
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10 border-b border-gray-200">
        <div class="flex items-center gap-3">
            <i class="ph-fill ph-hamburger text-3xl text-orange-500"></i>
            <h1 class="text-xl font-bold">Lanchonete <span class="text-sm font-normal text-gray-500 ml-2">Sistema</span>
            </h1>
        </div>

        <div class="flex items-center gap-4">
            <!-- Navegação apenas com Hover -->
            <nav class="flex gap-1 bg-gray-100 p-1 rounded-lg">
                <a href="index.html"
                    class="px-4 py-2 text-gray-600 hover:bg-white hover:text-orange-600 hover:shadow-sm rounded-md font-medium text-sm transition-all duration-200">Caixa</a>
                <a href="cozinha.html" target="_blank"
                    class="px-4 py-2 text-gray-600 hover:bg-white hover:text-orange-600 hover:shadow-sm rounded-md font-medium text-sm transition-all duration-200">Cozinha</a>
                <a href="painel.html" target="_blank"
                    class="px-4 py-2 text-gray-600 hover:bg-white hover:text-orange-600 hover:shadow-sm rounded-md font-medium text-sm transition-all duration-200">Painel TV</a>
            </nav>

            <!-- Botão de Configurações -->
            <button id="btnConfig"
                class="w-10 h-10 flex items-center justify-center bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full transition-colors"
                title="Menu e Configurações">
                <i class="ph-fill ph-gear text-xl"></i>
            </button>
        </div>
    </header>
    <main class="max-w-6xl w-full mx-auto p-8">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 mb-1">Cardápio</h1>
                <p class="text-gray-500">Gerencie seus produtos e categorias.</p>
            </div>
            <button id="novoProduto"
                class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2.5 rounded-lg font-semibold flex items-center gap-2 shadow-sm transition-colors">
                <i class="ph ph-plus-circle text-lg"></i> Novo Item
            </button>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex gap-4">
            <div class="relative flex-1">
                <i class="ph ph-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                <input id="filtroCardapio" autocomplete="off"
                    class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none"
                    placeholder="Buscar produto...">
            </div>
            <select id="filtroCategoria"
                class="w-64 px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none bg-white">
                <option value="">Todas as categorias</option>
            </select>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden" id="tabelaProdutos"></div>
    </main>
    <div id="modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <form id="produtoForm" class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 id="modalTitulo" class="text-xl font-bold text-gray-800">Novo item</h2>
                <button type="button" id="fecharModal"
                    class="text-gray-400 hover:text-gray-600 text-2xl transition-colors"><i
                        class="ph ph-x"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="produtoId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
                    <input id="produtoNome" autocomplete="off" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Preço (R$)</label>
                        <input id="produtoPreco" type="number" min="0" step="0.01" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                        <input id="produtoCategoria" autocomplete="off" placeholder="Ex: Bebidas" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                    <input id="produtoDescricao" autocomplete="off" placeholder="Opcional"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <label class="flex items-center gap-2 mt-4 cursor-pointer">
                    <input id="produtoAtivo" type="checkbox" checked
                        class="w-5 h-5 text-orange-500 rounded focus:ring-orange-500">
                    <span class="text-gray-700 font-medium">Disponível no caixa</span>
                </label>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                <button type="button" id="cancelar"
                    class="px-5 py-2 text-gray-600 hover:bg-gray-200 rounded-lg font-medium transition-colors">Cancelar</button>
                <button type="submit"
                    class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2 rounded-lg font-bold shadow-sm transition-colors">Salvar
                    item</button>
            </div>
        </form>
    </div>
    <div id="toast"
        class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl font-medium flex items-center gap-2 z-50">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cardapio.js"></script>

    <!-- Modal de Configurações Gerais -->
    <div id="configModal"
        class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="ph-fill ph-gear text-orange-500"></i> Menu e Configurações
                </h2>
                <button type="button" id="fecharConfig"
                    class="text-gray-400 hover:text-gray-600 text-2xl transition-colors">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <div class="p-6 space-y-6">
                <!-- Painel Administrativo / Operacional -->
                <div>
                    <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Gestão</h3>
                    <div id="gridBotoesConfig" class="grid grid-cols-3 gap-3">
                        <a href="pedidos.html"
                            class="flex flex-col items-center justify-center p-4 bg-gray-50 border border-gray-200 rounded-xl hover:bg-orange-50 hover:border-orange-200 hover:text-orange-600 transition-colors group">
                            <i
                                class="ph ph-receipt text-3xl text-gray-400 group-hover:text-orange-500 mb-2 transition-colors"></i>
                            <span class="font-semibold text-sm text-center">Histórico de pedidos</span>
                        </a>
                        <a href="cardapio.html"
                            class="flex flex-col items-center justify-center p-4 bg-gray-50 border border-gray-200 rounded-xl hover:bg-orange-50 hover:border-orange-200 hover:text-orange-600 transition-colors group">
                            <i
                                class="ph ph-list-dashes text-3xl text-gray-400 group-hover:text-orange-500 mb-2 transition-colors"></i>
                            <span class="font-semibold text-sm text-center">Editar cardápio</span>
                        </a>
                        <a href="fechamento.html"
                            class="flex flex-col items-center justify-center p-4 bg-gray-50 border border-gray-200 rounded-xl hover:bg-orange-50 hover:border-orange-200 hover:text-orange-600 transition-colors group">
                            <i
                                class="ph ph-calculator text-3xl text-gray-400 group-hover:text-orange-500 mb-2 transition-colors"></i>
                            <span class="font-semibold text-sm">Fechamento</span>
                        </a>
                    </div>
                </div>

                <!-- Configurações de Impressora -->
                <div>
                    <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Impressão (Cupom)</h3>
                    <div class="space-y-3">
                        <label
                            class="flex items-center justify-between p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                            <div>
                                <strong class="block text-sm text-gray-800">Impressão Automática</strong>
                                <small class="text-gray-500">Imprimir ao enviar pedido</small>
                            </div>
                            <input type="checkbox" id="printAuto"
                                class="w-5 h-5 text-orange-500 rounded focus:ring-orange-500">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
