<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete • Cozinha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-gray-900 h-screen flex flex-col font-sans text-gray-100 overflow-hidden" data-page="cozinha">

    <!-- Cabeçalho Ultra Minimalista (Modo Totem) -->
    <header class="bg-gray-800 px-6 py-2 flex justify-center items-center border-b border-gray-700">
        <h1 class="text-sm font-bold text-gray-300 tracking-[0.2em] uppercase flex items-center gap-2">

    <main class="flex flex-1 overflow-hidden p-6 gap-6" id="kds"></main>

    <div id="toast"

    </div>

    <!-- O AUDIO ESTÁ AQUI -->
    <audio id="somAlerta" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"

    <script src="/socket.io/socket.io.js"></script>
