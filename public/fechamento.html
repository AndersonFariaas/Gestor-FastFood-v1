<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete • Fechamento de Caixa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col font-sans text-gray-800" data-page="fechamento">

    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10 border-b border-gray-200">
        <div class="flex items-center gap-3">
            <i class="ph-fill ph-calculator text-3xl text-orange-500"></i>
            <h1 class="text-xl font-bold">Lanchonete <span
                    class="text-sm font-normal text-gray-500 ml-2">Financeiro</span></h1>
        </div>
        <nav class="flex gap-1 bg-gray-100 p-1 rounded-lg">
            <a href="index.html" class="px-4 py-2 text-gray-600 hover:text-gray-900 font-medium text-sm">Caixa</a>
            <a href="cozinha.html" class="px-4 py-2 text-gray-600 hover:text-gray-900 font-medium text-sm">Cozinha</a>
            <a href="cardapio.html" class="px-4 py-2 text-gray-600 hover:text-gray-900 font-medium text-sm">Cardápio</a>
            <a href="pedidos.html" class="px-4 py-2 text-gray-600 hover:text-gray-900 font-medium text-sm">Pedidos</a>
        </nav>
    </header>

    <main class="max-w-6xl w-full mx-auto p-8 flex flex-col gap-6">
        <div class="flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 mb-1">Fechamento de Caixa</h1>
                <p class="text-gray-500">Resumo financeiro do turno atual.</p>
            </div>
            <button id="btnEncerrarCaixa"
                class="bg-red-500 hover:bg-red-600 text-white px-5 py-2.5 rounded-lg font-bold shadow-md transition-colors flex items-center gap-2">
                <i class="ph ph-lock-key"></i> Encerrar Turno e Zerar Caixa
            </button>
        </div>

        <!-- Cards Principais -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl border border-green-100 shadow-sm border-l-4 border-l-green-500">
                <small class="text-gray-500 font-bold uppercase tracking-wider">Faturamento Líquido</small>
                <strong id="valFaturamento" class="block text-4xl font-black text-gray-900 mt-2">R$ 0,00</strong>
            </div>
            <div class="bg-white p-6 rounded-xl border border-blue-100 shadow-sm border-l-4 border-l-blue-500">
                <small class="text-gray-500 font-bold uppercase tracking-wider">Vendas Concluídas</small>
                <strong id="valVendas" class="block text-4xl font-black text-gray-900 mt-2">0</strong>
            </div>
            <div class="bg-white p-6 rounded-xl border border-red-100 shadow-sm border-l-4 border-l-red-500">
                <small class="text-gray-500 font-bold uppercase tracking-wider">Pedidos Cancelados</small>
                <strong id="valCancelados" class="block text-4xl font-black text-gray-900 mt-2">0</strong>
            </div>
        </div>

        <!-- Divisão por Formas de Pagamento -->
        <h2 class="text-xl font-bold text-gray-800 mt-4 border-b pb-2">Entradas por Forma de Pagamento</h2>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4" id="gridPagamentos">
            <!-- Injetado via JS -->
        </div>

    </main>

    <div id="toast"
        class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl font-medium flex items-center gap-2 z-50">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
    <script src="js/fechamento.js"></script>
</body>

</html>
