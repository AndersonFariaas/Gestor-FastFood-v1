<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete • Painel de Senhas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-gray-950 h-screen flex flex-col font-sans text-white overflow-hidden" data-page="painel">

    <!-- Cabeçalho da TV Minimalista -->
    <header class="px-10 py-4 flex justify-between items-center bg-black">
        <h1 class="text-2xl font-black tracking-widest text-white flex items-center gap-3 uppercase">
            <i class="ph-fill ph-hamburger text-orange-500 text-4xl"></i> Lanchonete
        </h1>
        <div id="relogio" class="text-2xl font-bold text-gray-500">00:00</div>
    </header>

    <main class="flex-1 flex overflow-hidden">

        <!-- DESTAQUE: CHAMANDO AGORA (Esquerda) -->
        <div
            class="w-1/2 flex flex-col items-center justify-center relative border-r border-gray-800 bg-gray-900 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-gray-800 to-gray-950 p-10">
            <div class="bg-black/40 px-8 py-3 rounded-full mb-8 border border-gray-700">
                <h2 class="text-2xl font-bold text-gray-400 uppercase tracking-[0.3em]"><i
                        class="ph-fill ph-bell-ringing"></i> Chamando Agora</h2>
            </div>

            <div id="senhaAtual"
                class="text-[18rem] font-black text-green-500 leading-none drop-shadow-[0_0_50px_rgba(34,197,94,0.4)] transition-all duration-300">
                --
            </div>

            <div id="clienteAtual"
                class="text-6xl font-medium text-white mt-8 uppercase text-center w-full truncate px-10">
                Aguardando...
            </div>
        </div>

        <!-- LISTAS DE STATUS (Direita) -->
        <div class="w-1/2 flex flex-col">

            <!-- PRONTOS (Aguardando Retirada) -->
            <div class="h-1/2 flex flex-col p-8 bg-gray-900 border-b border-gray-800">
                <h3 class="text-2xl font-bold text-green-500 mb-6 flex items-center gap-3">
                    <i class="ph-fill ph-check-circle"></i> PRONTOS
                </h3>
                <div id="gridProntos" class="flex-1 grid grid-cols-3 gap-4 content-start">
                    <!-- Injetado via JS -->
                </div>
            </div>

            <!-- EM PREPARO -->
            <div class="h-1/2 flex flex-col p-8 bg-gray-950">
                <h3 class="text-2xl font-bold text-yellow-500 mb-6 flex items-center gap-3">
                    <i class="ph-fill ph-cooking-pot"></i> EM PREPARO
                </h3>
                <div id="gridPreparo" class="flex-1 grid grid-cols-3 gap-4 content-start">
                    <!-- Injetado via JS -->
                </div>
            </div>

        </div>
    </main>

    <audio id="somCampainha" src="https://assets.mixkit.co/active_storage/sfx/2866/2866-preview.mp3"
        preload="auto"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
    <script src="js/painel.js"></script>
</body>

</html>
